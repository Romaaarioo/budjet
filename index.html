<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <title>Мои Финансы</title>
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="style.css">
  <script>
    // Тема и Liquid Glass применяются до отрисовки, чтобы не «мигало»
    const t = localStorage.getItem('fin_theme') || 'dark';
    document.documentElement.dataset.theme = t;
    document.documentElement.classList.toggle('glass', localStorage.getItem('fin_glass') !== 'false');
    document.querySelector('meta[name=theme-color]').content = t === 'light' ? '#f2f2f7' : '#000000';
  </script>
</head>
<body>
<main>

  <section id="view-overview" class="view">
    <h1 class="title">Счета</h1>
    <div class="card balance">
      <div class="lbl">Общий баланс</div>
      <div class="big" id="total-balance">0 ₽</div>
    </div>
    <div class="card list" id="account-list"></div>
    <button class="btn primary block" id="add-acc">Добавить счёт</button>
  </section>

  <section id="view-analytics" class="view">
    <h1 class="title">Аналитика</h1>
    <div class="row2">
      <div class="card stat"><div class="lbl">Доходы · месяц</div><div class="big sm in" id="month-income">0 ₽</div></div>
      <div class="card stat"><div class="lbl">Расходы · месяц</div><div class="big sm out" id="month-expense">0 ₽</div></div>
    </div>
    <div class="card"><div class="h2">Расходы по категориям</div><div id="category-bars"></div></div>
  </section>

  <section id="view-history" class="view">
    <h1 class="title">Операции</h1>
    <div id="history-list"></div>
  </section>

  <section id="view-investments" class="view">
    <h1 class="title">Инвестиции</h1>
    <div class="card"><div class="h2">Сводка</div><div id="invest-summary"></div></div>
    <div id="invest-list"></div>
  </section>

  <section id="view-more" class="view">
    <h1 class="title">Ещё</h1>
    <div class="card list">
      <button class="row" data-go="categories"><span class="ic">🏷️</span>Категории<span class="chev">›</span></button>
      <button class="row" data-go="autopays"><span class="ic">🔄</span>Автоплатежи<span class="chev">›</span></button>
    </div>
    <div class="card list">
      <label class="row"><span class="ic">🌙</span>Тёмная тема
        <span class="switch"><input type="checkbox" id="theme-toggle" checked><i></i></span>
      </label>
      <label class="row"><span class="ic">💎</span>Liquid Glass
        <span class="switch"><input type="checkbox" id="glass-toggle" checked><i></i></span>
      </label>
    </div>
    <div class="card list">
      <button class="row danger" id="clear-data"><span class="ic">🗑️</span>Очистить данные</button>
    </div>
  </section>

  <section id="view-categories" class="view">
    <button class="back" data-go="more">‹ Ещё</button>
    <h1 class="title">Категории</h1>
    <div class="card list" id="cat-list"></div>
    <button class="btn primary block" id="add-cat">Добавить категорию</button>
  </section>

  <section id="view-autopays" class="view">
    <button class="back" data-go="more">‹ Ещё</button>
    <h1 class="title">Автоплатежи</h1>
    <div class="card list" id="autopay-list"></div>
    <button class="btn primary block" id="add-pay">Добавить автоплатёж</button>
  </section>

</main>

<button id="fab" aria-label="Добавить">+</button>

<nav class="tabs">
  <button class="tab active" data-view="overview">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="3" width="8" height="8" rx="2"/><rect x="13" y="3" width="8" height="8" rx="2"/><rect x="3" y="13" width="8" height="8" rx="2"/><rect x="13" y="13" width="8" height="8" rx="2"/></svg>
    <span>Счета</span>
  </button>
  <button class="tab" data-view="history">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>
    <span>Операции</span>
  </button>
  <button class="tab" data-view="investments">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 17l6-6 4 4 7-7"/><path d="M14 8h6v6"/></svg>
    <span>Инвестиции</span>
  </button>
  <button class="tab" data-view="analytics">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M5 20v-8"/><path d="M12 20V5"/><path d="M19 20v-5"/></svg>
    <span>Аналитика</span>
  </button>
  <button class="tab" data-view="more">
    <svg viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="19" cy="12" r="2"/></svg>
    <span>Ещё</span>
  </button>
</nav>

<div class="sheet-back" id="modal">
  <div class="sheet">

    <form id="tx-form" data-type="expense">
      <div class="seg">
        <button type="button" class="seg-btn on" data-type="expense">Расход</button>
        <button type="button" class="seg-btn" data-type="income">Доход</button>
      </div>
      <label>Сумма<input type="number" id="tx-amount" inputmode="decimal" min="0" step="0.01" placeholder="0" required></label>
      <label>Категория<select id="tx-category"></select></label>
      <label>Счёт<select id="tx-account"></select></label>
      <label>Комментарий<input type="text" id="tx-note" maxlength="60" placeholder="необязательно"></label>
      <label>Дата<input type="date" id="tx-date" required></label>
      <div class="actions"><button type="button" class="btn ghost cancel">Отмена</button><button type="submit" class="btn primary">Сохранить</button></div>
    </form>

    <form id="inv-form" hidden>
      <div class="h2">Инвестиция</div>
      <label>Название<input type="text" id="inv-name" maxlength="40" placeholder="Например: S&P 500" required></label>
      <label>Сколько вложено, ₽<input type="number" id="inv-invested" inputmode="decimal" min="0" step="0.01" placeholder="0" required></label>
      <label>Текущая стоимость, ₽<input type="number" id="inv-current" inputmode="decimal" min="0" step="0.01" placeholder="0" required></label>
      <div class="actions"><button type="button" class="btn ghost cancel">Отмена</button><button type="submit" class="btn primary">Сохранить</button></div>
    </form>

    <form id="cat-form" data-type="expense">
      <div class="h2">Новая категория</div>
      <div class="seg">
        <button type="button" class="seg-btn on" data-type="expense">Расход</button>
        <button type="button" class="seg-btn" data-type="income">Доход</button>
      </div>
      <label>Название<input type="text" id="cat-name" maxlength="20" placeholder="Например: Спорт" required></label>
      <div id="emoji-row" class="emoji-row"></div>
      <label>Или свой эмодзи с клавиатуры<input type="text" id="cat-emoji" class="emoji-input" maxlength="8" placeholder="Вставь или набери любой эмодзи"></label>
      <div class="actions"><button type="button" class="btn ghost cancel">Отмена</button><button type="submit" class="btn primary">Сохранить</button></div>
    </form>

    <form id="acc-form" hidden>
      <div class="h2">Счёт</div>
      <label>Название<input type="text" id="acc-name" maxlength="20" placeholder="Например: Наличные" required></label>
      <label>Начальный остаток, ₽<input type="number" id="acc-start" inputmode="decimal" step="0.01" placeholder="0"></label>
      <div id="acc-emoji-row" class="emoji-row"></div>
      <label>Или свой эмодзи с клавиатуры<input type="text" id="acc-emoji" class="emoji-input" maxlength="8" placeholder="Вставь или набери любой эмодзи"></label>
      <div class="actions"><button type="button" class="btn ghost cancel">Отмена</button><button type="submit" class="btn primary">Сохранить</button></div>
    </form>

    <form id="pay-form" hidden>
      <div class="h2">Автоплатёж</div>
      <label>Название<input type="text" id="pay-name" maxlength="40" placeholder="Например: Аренда" required></label>
      <label>Сумма, ₽<input type="number" id="pay-amount" inputmode="decimal" min="0" step="0.01" placeholder="0" required></label>
      <label>День месяца (1–31)<input type="number" id="pay-day" inputmode="numeric" min="1" max="31" placeholder="5" required></label>
      <div class="actions"><button type="button" class="btn ghost cancel">Отмена</button><button type="submit" class="btn primary">Сохранить</button></div>
    </form>

  </div>
</div>

<script src="app.js"></script>
</body>
</html>
